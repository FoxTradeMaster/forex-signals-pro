services:
  # Web Service
  - type: web
    name: forex-signals-app
    env: node
    region: oregon
    plan: starter
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: PNPM_VERSION
        value: 10.4.1
      - key: DATABASE_URL
        fromDatabase:
          name: forex-db
          property: connectionString
      - key: POLYGON_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET_KEY
        sync: false
      - key: PAYPAL_MODE
        value: live
      - key: JWT_SECRET
        generateValue: true
      - key: SENDGRID_API_KEY
        sync: false
      - key: FROM_EMAIL
        value: noreply@foxtrademaster.com
      - key: VITE_APP_TITLE
        value: FOX TRADE MASTER™
      - key: VITE_APP_LOGO
        value: /logo.svg
      - key: VITE_APP_ID
        sync: false
      - key: OAUTH_SERVER_URL
        value: https://api.manus.im
      - key: VITE_OAUTH_PORTAL_URL
        value: https://portal.manus.im
      - key: OWNER_OPEN_ID
        sync: false
      - key: OWNER_NAME
        sync: false

  # Cron Job for Alert Monitoring
  - type: cron
    name: alert-monitor
    env: node
    region: oregon
    schedule: "*/5 * * * *"  # Every 5 minutes
    buildCommand: pnpm install
    startCommand: tsx server/cron/checkAlerts.ts
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: PNPM_VERSION
        value: 10.4.1
      - key: DATABASE_URL
        fromDatabase:
          name: forex-db
          property: connectionString
      - key: POLYGON_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: FROM_EMAIL
        value: noreply@foxtrademaster.com

  # Cron Job for AI Brain Self-Learning (every hour)
  - type: cron
    name: ai-brain-learning
    env: node
    region: oregon
    schedule: "0 * * * *"  # Every hour on the hour
    buildCommand: pnpm install
    startCommand: tsx server/cron/aiLearning.ts
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: PNPM_VERSION
        value: 10.4.1
      - key: DATABASE_URL
        fromDatabase:
          name: forex-db
          property: connectionString
      - key: POLYGON_API_KEY
        sync: false
      - key: BUILT_IN_FORGE_API_KEY
        sync: false
      - key: BUILT_IN_FORGE_API_URL
        sync: false

databases:
  # PostgreSQL Database
  - name: forex-db
    databaseName: forex_signals
    user: forex_admin
    region: oregon
    plan: starter
    postgresMajorVersion: 16
